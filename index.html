<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 크로마키 포토 스튜디오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 75%; /* 4:3 Aspect Ratio */
      overflow: hidden;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .flash-effect {
      animation: flashAnim 0.3s ease-out;
    }
    @keyframes flashAnim {
      0% { opacity: 0.9; background-color: white; }
      100% { opacity: 0; background-color: transparent; }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- Header -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-camera-retro"></i>
      </div>
      <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
        실시간 크로마키 포토 스튜디오
      </h1>
    </div>

    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-emerald-500 text-[8px] animate-pulse"></i> 웹캠 라이브</span>
      <span id="fpsDisplay" class="bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono">60 FPS</span>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Left/Top: Studio Canvas Viewport -->
    <main class="flex-1 bg-slate-950 p-4 md:p-6 flex flex-col items-center justify-center overflow-y-auto relative">
      <div class="w-full max-w-4xl flex flex-col gap-4">
        
        <!-- Live Canvas Container -->
        <div class="canvas-container relative rounded-xl border border-slate-800 bg-black/60 backdrop-blur">
          <canvas id="outputCanvas"></canvas>
          <video id="webcam" class="hidden" autoplay playsinline></video>

          <!-- Flash Overlay -->
          <div id="flashOverlay" class="absolute inset-0 pointer-events-none z-30"></div>

          <!-- Countdown Display Overlay -->
          <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 hidden">
            <span id="countdownText" class="text-9xl font-black text-white drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)] animate-ping">3</span>
          </div>

          <!-- Canvas Floating Controls -->
          <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50 flex items-center gap-4 z-10 shadow-xl">
            <button id="btnMirror" class="p-2 rounded-full hover:bg-slate-700 text-slate-300 hover:text-white transition" title="화면 좌우 반전">
              <i class="fa-solid fa-right-left"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-700"></div>
            <button id="btnCapture" class="flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-5 py-2 rounded-full font-semibold shadow-lg shadow-indigo-500/30 transition transform active:scale-95">
              <i class="fa-solid fa-camera"></i>
              <span>촬영하기</span>
            </button>
            <div class="h-4 w-[1px] bg-slate-700"></div>
            <select id="timerSelect" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
              <option value="0">타이머 없음</option>
              <option value="3">3초 타이머</option>
              <option value="5">5초 타이머</option>
            </select>
          </div>
        </div>

        <!-- Quick Status Bar -->
        <div class="flex items-center justify-between text-xs text-slate-400 bg-slate-900/50 px-4 py-2 rounded-lg border border-slate-800">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-info text-indigo-400"></i>
            <span id="statusText">웹캠 연결 준비 중...</span>
          </div>
          <div class="flex items-center gap-3">
            <button id="btnGalleryToggle" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium">
              <i class="fa-solid fa-images"></i> 갤러리 (<span id="galleryCount">0</span>)
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- Right: Studio Controls Panel -->
    <aside class="w-full md:w-96 bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 h-full overflow-hidden">
      <!-- Tabs Nav -->
      <div class="flex border-b border-slate-800 bg-slate-900/80 shrink-0">
        <button class="tab-btn flex-1 py-3 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500 transition" data-tab="chroma">
          <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 크로마키
        </button>
        <button class="tab-btn flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition" data-tab="bg">
          <i class="fa-solid fa-image mr-1"></i> 배경 선택
        </button>
        <button class="tab-btn flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition" data-tab="effects">
          <i class="fa-solid fa-sliders mr-1"></i> 필터/스티커
        </button>
      </div>

      <!-- Tab Contents Container -->
      <div class="flex-1 overflow-y-auto p-5 space-y-6">

        <!-- TAB 1: Chroma Key Settings -->
        <div id="tab-chroma" class="tab-content space-y-5">
          <div>
            <div class="flex items-center justify-between mb-3">
              <label class="text-sm font-semibold text-slate-200">크로마키 활성화</label>
              <input type="checkbox" id="chromaToggle" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" checked>
            </div>
            <p class="text-xs text-slate-400">배경을 투명하게 제거하고 새로운 사진으로 대체합니다.</p>
          </div>

          <div class="border-t border-slate-800 pt-4">
            <label class="text-xs font-semibold text-slate-300 block mb-2">키 색상 선택</label>
            <div class="grid grid-cols-3 gap-2">
              <button class="color-preset-btn active py-2 rounded-lg border border-indigo-500 bg-slate-800 text-xs text-slate-200 flex items-center justify-center gap-1.5" data-color="blue">
                <span class="w-3 h-3 rounded-full bg-blue-600"></span> 블루스크린
              </button>
              <button class="color-preset-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200 flex items-center justify-center gap-1.5" data-color="green">
                <span class="w-3 h-3 rounded-full bg-green-500"></span> 그린스크린
              </button>
              <label class="py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200 flex items-center justify-center gap-1.5 cursor-pointer hover:bg-slate-700">
                <input type="color" id="customColorPicker" value="#0000ff" class="w-4 h-4 rounded cursor-pointer border-0 bg-transparent p-0">
                <span>직접 선택</span>
              </label>
            </div>
          </div>

          <!-- Adjustments -->
          <div class="space-y-4 border-t border-slate-800 pt-4">
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">감도 (Sensitivity)</span>
                <span id="valSensitivity" class="text-indigo-400 font-mono">70</span>
              </div>
              <input type="range" id="inputSensitivity" min="10" max="180" value="70" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>

            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">경계 부드럽게 (Feather)</span>
                <span id="valSmoothness" class="text-indigo-400 font-mono">15</span>
              </div>
              <input type="range" id="inputSmoothness" min="0" max="50" value="15" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>

            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">색상 반사 억제 (Spill Reduction)</span>
                <span id="valSpill" class="text-indigo-400 font-mono">30</span>
              </div>
              <input type="range" id="inputSpill" min="0" max="100" value="30" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
          </div>
        </div>

        <!-- TAB 2: Background Selector -->
        <div id="tab-bg" class="tab-content hidden space-y-5">
          <div>
            <label class="text-sm font-semibold text-slate-200 block mb-2">커스텀 배경 업로드</label>
            <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-slate-700 rounded-xl cursor-pointer bg-slate-800/50 hover:bg-slate-800 hover:border-indigo-500 transition">
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-400 mb-1"></i>
                <p class="text-xs text-slate-300">내 PC에서 이미지 선택</p>
                <p class="text-[10px] text-slate-500 mt-0.5">PNG, JPG, WEBP 지원</p>
              </div>
              <input type="file" id="uploadBgInput" accept="image/*" class="hidden" />
            </label>
          </div>

          <div class="border-t border-slate-800 pt-4">
            <label class="text-sm font-semibold text-slate-200 block mb-3">기본 테마 배경</label>
            <div class="grid grid-cols-2 gap-2.5" id="presetBgGrid">
              <!-- Preset Items injected by JS -->
            </div>
          </div>
        </div>

        <!-- TAB 3: Photo Filters & Stickers -->
        <div id="tab-effects" class="tab-content hidden space-y-5">
          <!-- Photo Filters -->
          <div>
            <label class="text-sm font-semibold text-slate-200 block mb-3">사진 필터</label>
            <div class="grid grid-cols-3 gap-2">
              <button class="filter-btn active py-2 rounded-lg border border-indigo-500 bg-slate-800 text-xs text-slate-200" data-filter="normal">원본</button>
              <button class="filter-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-filter="vintage">빈티지</button>
              <button class="filter-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-filter="bw">흑백</button>
              <button class="filter-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-filter="bright">화사하게</button>
              <button class="filter-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-filter="warm">따뜻하게</button>
              <button class="filter-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-filter="cool">시원하게</button>
            </div>
          </div>

          <!-- Overlays & Frames -->
          <div class="border-t border-slate-800 pt-4">
            <label class="text-sm font-semibold text-slate-200 block mb-2">프레임 / 스티커 오버레이</label>
            <div class="grid grid-cols-3 gap-2">
              <button class="overlay-btn active py-2 rounded-lg border border-indigo-500 bg-slate-800 text-xs text-slate-200" data-overlay="none">없음</button>
              <button class="overlay-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-overlay="camera">카메라 프레임</button>
              <button class="overlay-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-xs text-slate-200" data-overlay="party">네컷 스타일</button>
            </div>
          </div>

          <!-- Color Tuning -->
          <div class="border-t border-slate-800 pt-4 space-y-3">
            <label class="text-sm font-semibold text-slate-200 block">세부 화질 조절</label>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">밝기</span>
                <span id="valBrightness" class="text-indigo-400 font-mono">100%</span>
              </div>
              <input type="range" id="inputBrightness" min="50" max="150" value="100" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>

            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">대비</span>
                <span id="valContrast" class="text-indigo-400 font-mono">100%</span>
              </div>
              <input type="range" id="inputContrast" min="50" max="150" value="100" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
          </div>
        </div>

      </div>
    </aside>
  </div>

  <!-- Gallery Modal -->
  <div id="galleryModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-images text-indigo-400"></i> 촬영된 사진 갤러리
        </h3>
        <button id="btnCloseGallery" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div id="galleryGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Captured photos will appear here -->
        <div id="emptyGalleryText" class="col-span-full py-12 text-center text-slate-500 text-sm">
          아직 촬영된 사진이 없습니다. [촬영하기] 버튼을 눌러보세요!
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Audio FX using Web Audio API
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playShutter() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playBeep() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
    }

    const sound = new SoundFX();

    // DOM Elements
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // UI Controls
    const statusText = document.getElementById('statusText');
    const fpsDisplay = document.getElementById('fpsDisplay');
    const chromaToggle = document.getElementById('chromaToggle');
    const inputSensitivity = document.getElementById('inputSensitivity');
    const inputSmoothness = document.getElementById('inputSmoothness');
    const inputSpill = document.getElementById('inputSpill');
    const valSensitivity = document.getElementById('valSensitivity');
    const valSmoothness = document.getElementById('valSmoothness');
    const valSpill = document.getElementById('valSpill');
    const customColorPicker = document.getElementById('customColorPicker');
    
    const inputBrightness = document.getElementById('inputBrightness');
    const inputContrast = document.getElementById('inputContrast');
    const valBrightness = document.getElementById('valBrightness');
    const valContrast = document.getElementById('valContrast');

    const btnMirror = document.getElementById('btnMirror');
    const btnCapture = document.getElementById('btnCapture');
    const timerSelect = document.getElementById('timerSelect');
    const flashOverlay = document.getElementById('flashOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownText = document.getElementById('countdownText');

    const uploadBgInput = document.getElementById('uploadBgInput');
    const presetBgGrid = document.getElementById('presetBgGrid');

    const galleryModal = document.getElementById('galleryModal');
    const galleryGrid = document.getElementById('galleryGrid');
    const emptyGalleryText = document.getElementById('emptyGalleryText');
    const btnGalleryToggle = document.getElementById('btnGalleryToggle');
    const btnCloseGallery = document.getElementById('btnCloseGallery');
    const galleryCount = document.getElementById('galleryCount');

    // App State
    let isMirrored = true;
    let selectedKeyColor = { r: 0, g: 0, b: 255 }; // Default Blue
    let activeFilter = 'normal';
    let activeOverlay = 'none';
    let currentBgImage = null;
    let capturedPhotos = [];

    // Preset Background SVG Generator & Data
    const presets = [
      { id: 'space', name: '우주 공간', type: 'svg', draw: drawSpaceBg },
      { id: 'beach', name: '해변 노을', type: 'gradient', bg: 'linear-gradient(to top, #ff7e5f, #feb47b)' },
      { id: 'cyber', name: '사이버펑크', type: 'gradient', bg: 'linear-gradient(135deg, #050515 0%, #1a0b2e 50%, #4c0033 100%)' },
      { id: 'studio', name: '네온 스튜디오', type: 'gradient', bg: 'linear-gradient(to right, #24243e, #302b63, #0f0c20)' }
    ];

    function drawSpaceBg(cCtx, w, h) {
      const grad = cCtx.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w, h));
      grad.addColorStop(0, '#111827');
      grad.addColorStop(1, '#030712');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      // Random stars
      cCtx.fillStyle = '#ffffff';
      for(let i = 0; i < 80; i++) {
        const x = (Math.sin(i * 99) * 0.5 + 0.5) * w;
        const y = (Math.cos(i * 33) * 0.5 + 0.5) * h;
        const size = (i % 3) + 1;
        cCtx.beginPath();
        cCtx.arc(x, y, size, 0, Math.PI * 2);
        cCtx.fill();
      }
    }

    // Tab Navigation Setup
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('text-indigo-400', 'border-indigo-500');
          b.classList.add('text-slate-400', 'border-transparent');
        });
        btn.classList.add('text-indigo-400', 'border-indigo-500');
        btn.classList.remove('text-slate-400', 'border-transparent');

        const tabId = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      });
    });

    // Color Presets Selection
    document.querySelectorAll('.color-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-preset-btn').forEach(b => b.classList.remove('active', 'border-indigo-500'));
        btn.classList.add('active', 'border-indigo-500');

        const type = btn.getAttribute('data-color');
        if (type === 'blue') selectedKeyColor = { r: 0, g: 0, b: 255 };
        if (type === 'green') selectedKeyColor = { r: 0, g: 255, b: 0 };
      });
    });

    customColorPicker.addEventListener('input', (e) => {
      const hex = e.target.value;
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      selectedKeyColor = { r, g, b };
    });

    // Range Sliders Event Listeners
    inputSensitivity.addEventListener('input', (e) => valSensitivity.textContent = e.target.value);
    inputSmoothness.addEventListener('input', (e) => valSmoothness.textContent = e.target.value);
    inputSpill.addEventListener('input', (e) => valSpill.textContent = e.target.value);
    inputBrightness.addEventListener('input', (e) => valBrightness.textContent = `${e.target.value}%`);
    inputContrast.addEventListener('input', (e) => valContrast.textContent = `${e.target.value}%`);

    // Filter Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'border-indigo-500'));
        btn.classList.add('active', 'border-indigo-500');
        activeFilter = btn.getAttribute('data-filter');
      });
    });

    // Overlay Buttons
    document.querySelectorAll('.overlay-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.overlay-btn').forEach(b => b.classList.remove('active', 'border-indigo-500'));
        btn.classList.add('active', 'border-indigo-500');
        activeOverlay = btn.getAttribute('data-overlay');
      });
    });

    // Render Preset Items into UI
    function initPresetsUI() {
      presetBgGrid.innerHTML = '';
      presets.forEach(p => {
        const card = document.createElement('div');
        card.className = 'cursor-pointer rounded-lg overflow-hidden border border-slate-700 bg-slate-800 p-2 text-center hover:border-indigo-500 transition flex flex-col items-center justify-center h-20 relative group';
        if (p.bg) card.style.background = p.bg;

        card.innerHTML = `<span class="text-xs font-semibold text-white drop-shadow">${p.name}</span>`;
        card.addEventListener('click', () => loadPresetBg(p));
        presetBgGrid.appendChild(card);
      });
    }

    function loadPresetBg(preset) {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 1280;
      pCanvas.height = 720;
      const pCtx = pCanvas.getContext('2d');

      if (preset.draw) {
        preset.draw(pCtx, 1280, 720);
      } else if (preset.bg) {
        const grad = pCtx.createLinearGradient(0, 0, 1280, 720);
        grad.addColorStop(0, '#ff7e5f');
        grad.addColorStop(1, '#feb47b');
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, 1280, 720);
      }

      const img = new Image();
      img.src = pCanvas.toDataURL();
      img.onload = () => {
        currentBgImage = img;
        statusText.textContent = `배경 변경됨: ${preset.name}`;
      };
    }

    // Custom Image Upload
    uploadBgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            currentBgImage = img;
            statusText.textContent = `사용자 배경 업로드 완료`;
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Mirror Toggle
    btnMirror.addEventListener('click', () => {
      isMirrored = !isMirrored;
      btnMirror.classList.toggle('text-indigo-400', isMirrored);
    });

    // Initialize Webcam
    async function initWebcam() {
      try {
        statusText.textContent = '웹캠 권한 요청 중...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.textContent = '스튜디오 작동 준비 완료';
        requestAnimationFrame(processFrame);
      } catch (err) {
        statusText.textContent = '웹캠 연결 실패. 카메라 권한을 확인하세요.';
        console.error("Webcam Error: ", err);
      }
    }

    // Frame Performance Metrics
    let lastTime = performance.now();
    let frameCount = 0;

    // Real-Time Frame Processing Algorithm
    function processFrame(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        fpsDisplay.textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastTime = now;
      }

      if (video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        const w = canvas.width;
        const h = canvas.height;

        // Offscreen canvas for raw video manipulation
        const offCanvas = document.createElement('canvas');
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext('2d');

        // Apply Mirroring
        if (isMirrored) {
          offCtx.translate(w, 0);
          offCtx.scale(-1, 1);
        }
        offCtx.drawImage(video, 0, 0, w, h);

        if (chromaToggle.checked) {
          const frameData = offCtx.getImageData(0, 0, w, h);
          const pixels = frameData.data;

          const sensitivity = parseInt(inputSensitivity.value, 10);
          const smoothness = parseInt(inputSmoothness.value, 10);
          const spill = parseInt(inputSpill.value, 10) / 100;

          const targetR = selectedKeyColor.r;
          const targetG = selectedKeyColor.g;
          const targetB = selectedKeyColor.b;

          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i];
            const g = pixels[i + 1];
            const b = pixels[i + 2];

            // Color distance Euclidean in RGB space
            const dist = Math.sqrt(
              (r - targetR) * (r - targetR) +
              (g - targetG) * (g - targetG) +
              (b - targetB) * (b - targetB)
            );

            if (dist < sensitivity) {
              pixels[i + 3] = 0; // Completely transparent
            } else if (dist < sensitivity + smoothness) {
              // Smooth alpha transition edge
              const alpha = (dist - sensitivity) / smoothness;
              pixels[i + 3] = alpha * 255;
            }

            // Spill Removal for Blue/Green tints on subject edges
            if (targetB > targetG && targetB > targetR) { // Blue Key
              if (b > (r + g) / 2) {
                pixels[i + 2] = (r + g) / 2 * spill + b * (1 - spill);
              }
            } else if (targetG > targetB && targetG > targetR) { // Green Key
              if (g > (r + b) / 2) {
                pixels[i + 1] = (r + b) / 2 * spill + g * (1 - spill);
              }
            }
          }

          offCtx.putImageData(frameData, 0, 0);
        }

        // Render Background first
        ctx.clearRect(0, 0, w, h);
        if (currentBgImage) {
          ctx.drawImage(currentBgImage, 0, 0, w, h);
        } else {
          // Default Dark Gradient Background
          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#1e293b');
          grad.addColorStop(1, '#0f172a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // Apply Custom Brightness/Contrast Filters
        ctx.filter = `brightness(${inputBrightness.value}%) contrast(${inputContrast.value}%)`;

        // Draw Processed Foreground Video Layer
        ctx.drawImage(offCanvas, 0, 0, w, h);
        ctx.filter = 'none'; // Reset canvas filter

        // Apply Stylized Photo Filters
        applyPhotoFilters(ctx, w, h);

        // Apply Overlays / Frames
        applyOverlays(ctx, w, h);
      }

      requestAnimationFrame(processFrame);
    }

    // Photo Filters Renderer
    function applyPhotoFilters(cCtx, w, h) {
      if (activeFilter === 'bw') {
        const imgData = cCtx.getImageData(0, 0, w, h);
        const p = imgData.data;
        for (let i = 0; i < p.length; i += 4) {
          const v = 0.2126 * p[i] + 0.7152 * p[i + 1] + 0.0722 * p[i + 2];
          p[i] = p[i + 1] = p[i + 2] = v;
        }
        cCtx.putImageData(imgData, 0, 0);
      } else if (activeFilter === 'vintage') {
        cCtx.fillStyle = 'rgba(120, 50, 0, 0.15)';
        cCtx.fillRect(0, 0, w, h);
      } else if (activeFilter === 'warm') {
        cCtx.fillStyle = 'rgba(255, 160, 0, 0.1)';
        cCtx.fillRect(0, 0, w, h);
      } else if (activeFilter === 'cool') {
        cCtx.fillStyle = 'rgba(0, 120, 255, 0.1)';
        cCtx.fillRect(0, 0, w, h);
      }
    }

    // Overlay / Frames Renderer
    function applyOverlays(cCtx, w, h) {
      if (activeOverlay === 'camera') {
        // Camera Viewfinder HUD Overlay
        cCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        cCtx.lineWidth = 2;
        const len = 30;

        // Corners
        // Top-Left
        cCtx.beginPath(); cCtx.moveTo(40, 40 + len); cCtx.lineTo(40, 40); cCtx.lineTo(40 + len, 40); cCtx.stroke();
        // Top-Right
        cCtx.beginPath(); cCtx.moveTo(w - 40 - len, 40); cCtx.lineTo(w - 40, 40); cCtx.lineTo(w - 40, 40 + len); cCtx.stroke();
        // Bottom-Left
        cCtx.beginPath(); cCtx.moveTo(40, h - 40 - len); cCtx.lineTo(40, h - 40); cCtx.lineTo(40 + len, h - 40); cCtx.stroke();
        // Bottom-Right
        cCtx.beginPath(); cCtx.moveTo(w - 40 - len, h - 40); cCtx.lineTo(w - 40, h - 40); cCtx.lineTo(w - 40, h - 40 - len); cCtx.stroke();

        // REC text
        cCtx.fillStyle = '#ef4444';
        cCtx.beginPath(); cCtx.arc(w - 80, 50, 6, 0, Math.PI * 2); cCtx.fill();
        cCtx.fillStyle = '#ffffff';
        cCtx.font = 'bold 14px monospace';
        cCtx.fillText('LIVE REC', w - 65, 54);
      } else if (activeOverlay === 'party') {
        // Photo Booth Border Frame
        cCtx.strokeStyle = '#ffffff';
        cCtx.lineWidth = 16;
        cCtx.strokeRect(8, 8, w - 16, h - 16);

        cCtx.fillStyle = '#ffffff';
        cCtx.font = 'bold 18px Pretendard, sans-serif';
        cCtx.fillText('PHOTO STUDIO ★ LIVE', 30, h - 25);
      }
    }

    // Capture Photo Action
    btnCapture.addEventListener('click', () => {
      const delay = parseInt(timerSelect.value, 10);
      if (delay > 0) {
        runCountdown(delay);
      } else {
        takeSnapshot();
      }
    });

    function runCountdown(seconds) {
      btnCapture.disabled = true;
      countdownOverlay.classList.remove('hidden');
      let current = seconds;
      countdownText.textContent = current;
      sound.playBeep();

      const timer = setInterval(() => {
        current--;
        if (current > 0) {
          countdownText.textContent = current;
          sound.playBeep();
        } else {
          clearInterval(timer);
          countdownOverlay.classList.add('hidden');
          btnCapture.disabled = false;
          takeSnapshot();
        }
      }, 1000);
    }

    function takeSnapshot() {
      sound.playShutter();

      // Trigger Flash Effect
      flashOverlay.classList.add('flash-effect');
      setTimeout(() => flashOverlay.classList.remove('flash-effect'), 300);

      // Export Canvas Data
      const dataUrl = canvas.toDataURL('image/png');
      capturedPhotos.unshift(dataUrl);

      galleryCount.textContent = capturedPhotos.length;
      statusText.textContent = '사진이 촬영되어 갤러리에 저장되었습니다!';

      updateGalleryUI();
    }

    // Gallery Render Logic
    function updateGalleryUI() {
      if (capturedPhotos.length === 0) {
        emptyGalleryText.classList.remove('hidden');
        return;
      }
      emptyGalleryText.classList.add('hidden');

      galleryGrid.innerHTML = '';
      capturedPhotos.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'relative group rounded-xl overflow-hidden bg-slate-800 border border-slate-700 shadow-md flex flex-col';
        item.innerHTML = `
          <img src="${src}" class="w-full h-36 object-cover" />
          <div class="p-2 bg-slate-900/90 flex items-center justify-between">
            <span class="text-[10px] text-slate-400 font-mono">#${capturedPhotos.length - idx}</span>
            <div class="flex items-center gap-2">
              <a href="${src}" download="chromakey_studio_${Date.now()}.png" class="p-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs transition" title="다운로드">
                <i class="fa-solid fa-download"></i>
              </a>
              <button onclick="deletePhoto(${idx})" class="p-1.5 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-400 hover:text-white text-xs transition" title="삭제">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        galleryGrid.appendChild(item);
      });
    }

    window.deletePhoto = function(idx) {
      capturedPhotos.splice(idx, 1);
      galleryCount.textContent = capturedPhotos.length;
      updateGalleryUI();
    };

    // Gallery Toggle Events
    btnGalleryToggle.addEventListener('click', () => galleryModal.classList.remove('hidden'));
    btnCloseGallery.addEventListener('click', () => galleryModal.classList.add('hidden'));

    // Start App on Window Load
    window.onload = () => {
      initPresetsUI();
      loadPresetBg(presets[0]); // Space preset default
      initWebcam();
    };
  </script>
</body>
</html>
